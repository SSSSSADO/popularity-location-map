services:
    web:
        build: .
        command: python manage.py runserver 0.0.0.0:8000
        ports:
            - "127.0.0.1:8000:8000"
        environment:
        DB_NAME: location_db
        DB_USER: location_user
        DB_PASSWORD: location_password
        DB_HOST: db
        DB_PORT: "5432"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy


    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: location_db
            POSTGRES_USER: location_user
            POSTGRES_PASSWORD: location_password
        ports:
            - "127.0.0.1:5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U location_user -d location_db"]
        interval: 5s
        timeout: 5s
        retries: 5


redis:
    image: redis:7-alpine
    ports:
        - "127.0.0.1:6379:6379"
    volumes:
        - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 5

volumes:
postgres_data:
redis_data:
